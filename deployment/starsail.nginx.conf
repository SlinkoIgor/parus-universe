server {
    listen 80;
    listen [::]:80;
    server_name starsail.fly www.starsail.fly;
    location ^~ /.well-known/acme-challenge/ { root /var/www/parus-acme; }
    location / { return 301 https://starsail.fly$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name starsail.fly;

    ssl_certificate /etc/letsencrypt/live/starsail.fly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starsail.fly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/parus/current/site;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/parus.access.log;
    error_log /var/log/nginx/parus.error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;

    # The dashboard/API stay private on loopback. Only event collection is public.
    location = /analytics/api/send {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3100/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /analytics/ { return 404; }

    location ~ "^/(catalog-data|map-radial|map-slices|map-visibility|map-layers|sky-dss-data)/[a-f0-9]{12}/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}

# Keep www available while using the apex domain as the canonical address.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.starsail.fly;
    ssl_certificate /etc/letsencrypt/live/starsail.fly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starsail.fly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://starsail.fly$request_uri;
}
